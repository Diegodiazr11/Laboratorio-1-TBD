spring.application.name=backend

#CONFIGURACIONES PROVICIONALES (CAMBIAR LUEGO POR VARIABLES DE ENTORNO)

# Puerto del servidor
server.port=8080

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/alojamientos_db
spring.datasource.username=postgres
spring.datasource.password=tu_contraseña
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JWT
# Esta clave debe tener al menos 256 bits (32 caracteres)
jwt.secret=ClaveSecretaSuperSeguraParaElProyectoDeTallerDeBaseDeDatos2026
# Expiración en milisegundos (ej. 24 horas = 86400000)
jwt.expiration=86400000
