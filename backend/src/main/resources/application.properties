spring.application.name=backend

#CONFIGURACIONES PROVICIONALES (CAMBIAR LUEGO POR VARIABLES DE ENTORNO)

# Puerto del servidor
server.port=8080

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://${PUERTO_DB}/${NOMBRE_DB}
spring.datasource.username=${USER_DB}
spring.datasource.password=${PASSWORD_DB}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JWT
# Esta clave debe tener al menos 256 bits (32 caracteres)
jwt.secret=${JWT_SECRET}
# Expiración en milisegundos (ej. 24 horas = 86400000)
jwt.expiration=${JWT_EXPIRATION}
